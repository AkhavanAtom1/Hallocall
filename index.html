<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060d" />
    <meta name="description" content="HalloCall — تماس صوتی ساده و سریع با دوستان" />
    <script>
      try {
        const root = document.documentElement;
        const mode = localStorage.getItem("hallocall-theme");
        root.classList.toggle("light", mode === "light");
        root.classList.toggle("dark", mode !== "light");
        root.style.colorScheme = mode === "light" ? "light" : "dark";
        const palette = localStorage.getItem("hallocall-color-theme");
        const allowed = ["violet", "ocean", "rose", "emerald", "sunset", "special"];
        root.dataset.colorTheme = allowed.includes(palette) ? palette : "violet";
      } catch {}
    </script>
    <link rel="icon" type="image/webp" href="/avatars/hallocall.webp" />
    <link rel="apple-touch-icon" href="/avatars/hallocall.webp" />
    <link rel="mask-icon" href="/avatars/hallocall.webp" color="#8b5cf6" />
    <meta property="og:title" content="HalloCall — تماس صوتی با دوستان" />
    <meta property="og:description" content="یک تماس، یک حلقه نور و تا ۲۰ نفر دور هم." />
    <meta property="og:image" content="/avatars/hallocall.webp" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/site/hero-voice.webp" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" /></noscript>
    <title>HalloCall — تماس صوتی با دوستان</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
